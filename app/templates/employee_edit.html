{% extends "base.html" %}
{% block title %}Edit employee | Expense Claims{% endblock %}
{% block content %}
<section class="intro"><p class="eyebrow">Admin directory</p><h1>Edit {{ employee.name }}.</h1><p>Update the employee record or deactivate access. Leave the password blank to keep it unchanged.</p></section>
<form method="post" action="/admin/employees/{{ employee.id }}/edit" class="ledger-form"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Employee ID<input value="{{ employee.id }}" disabled></label><label>Full name<input name="name" value="{{ employee.name }}" required></label><label>Email<input type="email" name="email" value="{{ employee.email }}" required></label><label>Designation<input name="designation" value="{{ employee.designation }}" required></label><label>Role<select name="role">{% for option in ['staff', 'manager', 'finance'] %}<option value="{{ option }}" {% if employee.role == option %}selected{% endif %}>{{ option|upper }}</option>{% endfor %}</select></label><label>Manager ID<input name="manager_id" value="{{ employee.manager_id or '' }}"></label><label>Monthly limit (paise)<input name="monthly_limit_paise" type="number" min="0" value="{{ employee.monthly_limit_paise }}" required></label><label>New password<input name="password" type="password" minlength="8" placeholder="Leave blank to keep current password"></label><label class="check-row"><input type="checkbox" name="active" value="true" {% if employee.active %}checked{% endif %}> Account active</label><div class="actions"><button class="button" type="submit">Save changes</button><a class="button" href="/admin/employees/{{ employee.id }}">Cancel</a></div></form>
{% endblock %}
