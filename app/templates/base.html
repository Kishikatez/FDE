<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Expense Claims{% endblock %}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <header class="masthead">
    <a href="/dashboard" class="wordmark">Expense Claims</a>
    {% if user %}<span class="demo">{{ user.name }} · {{ user.designation }}</span>{% if user.role.value == 'admin' %}<a class="nav-link" href="/admin/employees">People</a>{% endif %}<form method="post" action="/sign-out"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button>Sign out</button></form>{% endif %}
  </header>
  <main class="page">{% block content %}{% endblock %}</main>
</body>
</html>
