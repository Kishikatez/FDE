{% extends "base.html" %}
{% block title %}Review claim | Expense Claims{% endblock %}
{% block content %}<section class="intro"><p class="eyebrow">Review before submission</p><h1>Does this look right?</h1></section><form method="post" action="/claims/submit" class="ledger-form"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="receipt_text" value="{{ receipt_text }}"><label>Merchant <input name="merchant" value="{{ draft.merchant }}" required></label><label>Amount (paise) <input name="amount_paise" type="number" min="1" value="{{ draft.amount_paise }}" required></label><label>Expense date <input name="expense_date" type="date" value="{{ draft.expense_date }}" required></label><label>Category <select name="category">{% for category in categories %}<option value="{{ category.value }}" {% if category == draft.category %}selected{% endif %}>{{ category.value }}</option>{% endfor %}</select></label><label>Receipt number <input name="receipt_no" value="{{ draft.receipt_no or '' }}"></label><label>Duplicate exception note <input name="duplicate_ack_note" placeholder="Required only if this is genuinely different"></label><button class="button" type="submit">Send to manager</button></form>{% endblock %}
